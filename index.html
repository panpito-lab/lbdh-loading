<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBDH — Chargement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--or:#d2a032;--or2:#f0cf7a;--creme:#efe6d6;--gris:#a9a294;--pulse:0;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--creme);
  font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;cursor:default}

/* ---------- Scène commune ---------- */
#scene{position:fixed;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity 2.5s ease;overflow:hidden}
body.parti #scene{opacity:1}
#scene.secousse{animation:secousse .6s cubic-bezier(.36,.07,.19,.97)}
#scene.tremble{animation:secousse .35s linear}
@keyframes secousse{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
#diapo{position:absolute;top:0;left:0;right:0;bottom:0;filter:saturate(.72) contrast(1.1) brightness(.8)}
#diapo .plan{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s ease;will-change:transform,opacity}
#diapo .plan.actif{opacity:1}
/* diaporama monte sur la musique : coupes nettes, mouvement de chaque plan cale sur le morceau */
body.ba-on #diapo .plan{transition:opacity .35s ease}
#diapo{transition:opacity 2.5s ease}
#diapo.fin{opacity:0}
/* apres la musique : defilement lent jusqu'a 5 min, puis seulement l'interface et les bruits du front */
/* l'etalonnage est cuit dans les photos (fonds.py) : un filtre CSS sur un calque anime se recalcule a chaque image */
body.v-b #diapo{filter:none}
body.v-b .rayons,body.v-b .brume{display:none}
/* teinte et lumiere chaude cuites dans les photos (fonds.py) : un mode de fusion sur un calque qui bouge se recalcule a
   chaque image ; vignettage fige (il suivait la musique et se redessinait en permanence) */
body.v-b .teinte,body.v-b .chaud{display:none}
body.v-b .vignette{display:none}
/* halo du logo fige : un flou dont la taille suit la musique se recalcule a chaque image */
body.v-b .logo-lueur{filter:drop-shadow(0 0 16px rgba(210,160,50,.4))}
/* grain de pellicule (fusion « overlay » plein ecran) et fusion de l'eclat : trop couteux sans carte graphique */
body.v-b #grain{display:none}
body.v-b #eclat{mix-blend-mode:normal;display:none}
body.v-b #eclat.on{display:block}
/* pas de will-change sur la carte : le navigateur garderait l'image a sa taille de depart et l'agrandirait (flou) */
body.v-b #diapo .plan{transform:translateZ(0);backface-visibility:hidden}
#credit{display:none!important}
/* mode leger (navigateur sans carte graphique trop lent, ex. le CEF de GMod) : le balayage dore du logo se repeint a
   chaque image, fige ; le mouvement des photos, la carte et les braises passent a 30 images/s (voir passerLeger) */
body.leger .logo-or .or{animation:none;background-position:45% 0}
/* mode GMod : pendant le chargement, le jeu ne rafraichit l'ecran qu'entre deux etapes (montage d'un addon, precache,
   Lua) ; tout mouvement continu (zoom, traveling) revele ces a-coups. Ici les photos ne bougent plus : elles se FONDENT
   lentement l'une dans l'autre (le nouveau plan arrive par-dessus l'ancien, qui reste plein), un gel au milieu d'un
   fondu ne se voit pas. Pas de braises (toile plein ecran redessinee en continu).
   Automatique quand la page est ouverte par GMod (steamid dans l'adresse ou GameDetails) ; forcable #gmod, #fluide l'interdit. */
body.gmod #diapo .plan{transition:opacity 1.5s ease;transform:none!important;will-change:opacity}
body.gmod #braises,body.gmod #nuit{display:none}
/* volume : haut-parleur + curseur, discret en haut a gauche, memorise d'une connexion a l'autre */
#volume{position:fixed;top:2.6vh;left:2.4vw;z-index:30;display:flex;align-items:center;gap:.7vw;opacity:0;transition:opacity 1.2s ease 1.5s}
body.parti #volume{opacity:.55}
#volume:hover{opacity:1;transition-delay:0s;transition-duration:.25s}
#volume button{width:2.4vw;height:2.4vw;min-width:26px;min-height:26px;padding:0;border:0;background:none;cursor:pointer;color:var(--or2)}
#volume button svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#volume .ondes{transition:opacity .25s}
#volume.muet .ondes{opacity:0}
#volume .croix{display:none}
#volume.muet .croix{display:block}
#volume input{-webkit-appearance:none;appearance:none;width:8vw;min-width:90px;height:2px;background:rgba(239,230,214,.25);outline:none;cursor:pointer;margin:0}
#volume input::-webkit-slider-thumb{-webkit-appearance:none;width:1vw;height:1vw;min-width:11px;min-height:11px;border-radius:50%;background:var(--or2);box-shadow:0 0 8px rgba(240,207,122,.7)}
#volume span{font-size:clamp(10px,.7vw,14px);letter-spacing:.14em;color:var(--creme);min-width:3ch;font-variant-numeric:tabular-nums}
#fps{position:fixed;left:8px;bottom:8px;z-index:70;display:none;font:500 12px/1.4 monospace;color:#f0cf7a;background:rgba(0,0,0,.6);padding:3px 7px;pointer-events:none}
#fps.on{display:block}
body.calme #diapo{opacity:0;transition:opacity 6s ease}
#eclat{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 58%,rgba(255,196,120,.6),rgba(255,120,40,.2) 45%,rgba(0,0,0,0) 75%)}
#eclat.on{animation:eclat .75s ease-out}
@keyframes eclat{0%{opacity:1}100%{opacity:0}}
.kb1{animation:kb1 13s linear forwards}.kb2{animation:kb2 13s linear forwards}.kb3{animation:kb3 13s linear forwards}.kb4{animation:kb4 13s linear forwards}
@keyframes kb1{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.13) translate(-2.5%,-1.2%)}}
@keyframes kb2{from{transform:scale(1.13) translate(2%,1%)}to{transform:scale(1.03) translate(0,0)}}
@keyframes kb3{from{transform:scale(1.04) translate(2%,0)}to{transform:scale(1.12) translate(-2%,1%)}}
@keyframes kb4{from{transform:scale(1.12) translate(-2%,-1%)}to{transform:scale(1.04) translate(1.5%,.5%)}}
.teinte{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(40,48,60,.45),rgba(0,0,0,0) 45%,rgba(60,38,10,.35));mix-blend-mode:multiply;transition:background 1.5s}
.chaud{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 70% 110%,rgba(210,120,40,.28),rgba(0,0,0,0) 60%);mix-blend-mode:screen}
.rayons{position:absolute;left:-25%;top:-40%;width:95%;height:170%;transform-origin:0 0;transform:rotate(-16deg);mix-blend-mode:screen;opacity:.7;filter:blur(14px);pointer-events:none;
  background:linear-gradient(100deg,rgba(0,0,0,0) 18%,rgba(255,228,170,.09) 23%,rgba(0,0,0,0) 29%,rgba(255,228,170,.06) 36%,rgba(0,0,0,0) 42%,rgba(255,220,160,.08) 50%,rgba(0,0,0,0) 57%,rgba(255,228,170,.05) 64%,rgba(0,0,0,0) 70%);
  animation:rayons 16s ease-in-out infinite alternate}
@keyframes rayons{from{transform:rotate(-19deg);opacity:.45}to{transform:rotate(-12deg);opacity:.85}}
.brume{position:absolute;left:0;width:200%;background-repeat:repeat-x;background-size:50% 100%;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent)}
.brume.b1{bottom:-10%;height:60%;opacity:.75;animation:derive 110s linear infinite}
.brume.b2{bottom:10%;height:45%;opacity:.35;animation:derive 170s linear infinite reverse}
@keyframes derive{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#nuit{position:absolute;top:0;left:0;width:100%;height:100%;mix-blend-mode:screen;display:none}
#braises{position:absolute;top:0;left:0;width:100%;height:100%}
.vignette{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 100%);opacity:calc(.95 - var(--pulse)*.35)}
#grain{position:absolute;top:0;left:0;right:0;bottom:0;opacity:.085;mix-blend-mode:overlay;background-size:256px 256px;pointer-events:none}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff1d0;opacity:0;pointer-events:none;z-index:20}
#flash.on{animation:flash 1.4s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.ui{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:10}
body.v-a #ui-a,body.v-b #ui-b,body.v-c #ui-c{display:block}
.fondu{transition:opacity .9s ease}
.fondu.cache{opacity:0}
.patience{opacity:0;transition:opacity 1.5s ease}
body.lent .patience{opacity:1}
.logo-lueur{filter:drop-shadow(0 0 calc(10px + var(--pulse) * 28px) rgba(210,160,50,calc(.25 + var(--pulse) * .45)))}
/* logo doré : le PNG sert de masque à un dégradé métallique qui balaie */
.logo-or{position:relative}
.logo-or img{display:block;width:100%;visibility:hidden}
.logo-or .or{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(110deg,#7a5418 0%,#c9952e 20%,#f7dd97 31%,#b8842a 43%,#e2bb5e 55%,#fff3c8 62%,#a6761f 76%,#d9ab45 90%,#8a6020 100%);background-size:240% 100%;
  animation:orbalaye 6s ease-in-out infinite alternate}
@keyframes orbalaye{from{background-position:0 0}to{background-position:100% 0}}
kbd,.cmd{font-family:inherit;font-style:normal;font-weight:700;color:var(--or2)}
kbd{display:inline-block;padding:0 .42em;margin:0 .08em;border:1px solid rgba(210,160,50,.75);border-radius:.25em;background:rgba(0,0,0,.45);box-shadow:0 .12em 0 rgba(210,160,50,.45);font-size:.88em;line-height:1.35}

/* ---------- A : Cinéma ---------- */
#ui-a .lb{position:absolute;left:0;right:0;height:50.5vh;background:#000;display:flex;transition:height 3.2s cubic-bezier(.75,0,.2,1) .5s}
body.a-ouvre #ui-a .lb{height:11.5vh}
#ui-a .lb-haut{top:0;align-items:flex-end}
#ui-a .lb-bas{bottom:0;align-items:flex-start}
.a-rangee{width:100%;height:11.5vh;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;position:relative}
.a-coin{display:flex;align-items:center;gap:1.1vw}
.a-tard{opacity:0;transition:opacity 1.6s ease .4s}
body.a-pose .a-tard{opacity:1}
.a-coin img{height:4.6vh}
.a-serveur{font-weight:700;font-size:clamp(11px,.78vw,16px);letter-spacing:.32em;text-transform:uppercase;color:var(--creme)}
.a-carte{font-size:clamp(10px,.68vw,14px);letter-spacing:.18em;color:var(--gris);margin-top:.35em;text-transform:uppercase}
.a-carte b{color:var(--or);font-weight:500}
.a-legende{font-size:clamp(10px,.7vw,14px);letter-spacing:.24em;text-transform:uppercase;color:var(--gris);text-align:right}
.a-legende:before{content:"";display:inline-block;width:2.2vw;height:1px;background:var(--or);vertical-align:middle;margin-right:.9vw}
.a-barre{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(239,230,214,.08)}
.a-barre i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(210,160,50,.15),var(--or) 85%,#fff3c4);box-shadow:0 0 12px rgba(210,160,50,.8)}
.a-barre i:after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff3c4;box-shadow:0 0 14px 4px rgba(240,200,110,.9)}
.a-statut b{display:block;font-weight:700;font-size:clamp(11px,.78vw,16px);letter-spacing:.28em;text-transform:uppercase;color:var(--or)}
.a-statut small{display:block;margin-top:.5em;font-size:clamp(10px,.66vw,13px);color:var(--gris);letter-spacing:.06em;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-droite{display:flex;align-items:baseline;gap:2vw}
.a-duree{font-size:clamp(10px,.68vw,14px);letter-spacing:.2em;color:var(--gris)}
.a-pct{font-weight:300;font-size:clamp(28px,2.6vw,54px);letter-spacing:.02em;color:var(--creme);font-variant-numeric:tabular-nums}
.a-pct sup{font-size:.4em;color:var(--or);margin-left:.15em;vertical-align:.9em}
.a-sous-titre{position:absolute;left:0;right:0;bottom:15.5vh;text-align:center;padding:0 12vw}
.a-sous-titre > span{display:inline-block;font-style:italic;font-weight:400;font-size:clamp(15px,1.25vw,26px);line-height:1.5;color:#f6efe2;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 2px #000}
.a-patience{position:absolute;left:0;right:0;top:13.5vh;text-align:center;font-size:clamp(10px,.7vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--or2);text-shadow:0 1px 8px #000}
.a-intro{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.6s ease,transform 1.8s ease}
body.a-pose .a-intro{opacity:0;transform:scale(.94)}
.a-logo{position:relative;width:min(44vw,840px)}
.a-logo img{width:100%;display:block}
body.a-ouvre .a-logo img{animation:apparition 3.2s cubic-bezier(.2,.7,.2,1) both .6s}
.a-reflet{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;
  background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,240,200,.95) 50%,rgba(255,255,255,0) 65%);background-size:250% 100%;background-position:150% 0}
body.a-ouvre .a-reflet{animation:reflet 2.4s ease-in-out 2.6s both}
@keyframes apparition{from{opacity:0;transform:scale(1.07);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes reflet{from{background-position:150% 0}to{background-position:-60% 0}}
.a-devise{margin-top:3.2vh;font-size:clamp(11px,.85vw,17px);letter-spacing:.6em;text-transform:uppercase;color:var(--or);opacity:0}
body.a-ouvre .a-devise{animation:apparition 2.4s ease both 3.4s}

/* ---------- B : Bande-annonce ---------- */
.b-noir{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;opacity:.8;transition:opacity 2.5s ease}
body.b-revele .b-noir{opacity:.15}
.b-carte{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;opacity:0}
.b-carte.vu{animation:carte 4.1s ease both}
@keyframes carte{0%{opacity:0;letter-spacing:.55em;filter:blur(10px)}22%{opacity:1;filter:blur(0)}78%{opacity:1}100%{opacity:0;letter-spacing:.2em;filter:blur(4px)}}
.b-kicker{font-size:clamp(11px,.9vw,18px);font-weight:700;letter-spacing:.6em;color:var(--or);margin-bottom:2.2vh;min-height:1em}
.b-grand{font-weight:900;font-size:clamp(30px,4.1vw,86px);line-height:1.12;letter-spacing:.32em;text-transform:uppercase;color:var(--creme);text-shadow:0 4px 30px rgba(0,0,0,.8)}
.b-trait{width:0;height:2px;background:var(--or);margin-top:3vh;box-shadow:0 0 12px rgba(210,160,50,.8)}
.b-carte.vu .b-trait{animation:trait 3.6s ease .4s both}
@keyframes trait{from{width:0}50%{width:12vw}to{width:12vw}}
.b-logo{position:absolute;left:50%;top:50%;width:min(52vw,980px);transform:translate(-50%,-50%) scale(1.25);opacity:0}
body.b-slam .b-logo{animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{opacity:0;transform:translate(-50%,-50%) scale(1.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
body.b-slam #diapo{animation:poussee 3.2s cubic-bezier(.1,.8,.2,1) both}
@keyframes poussee{from{transform:scale(1.12)}to{transform:scale(1)}}
body.b-pose .b-logo{animation:none;opacity:1;transition:top 1.8s cubic-bezier(.6,0,.2,1),width 1.8s cubic-bezier(.6,0,.2,1);top:21vh;width:min(26vw,520px);transform:translate(-50%,-50%)}
.b-onde{position:absolute;left:50%;top:50%;width:10vw;height:10vw;margin:-5vw 0 0 -5vw;border-radius:50%;border:2px solid rgba(240,207,122,.9);opacity:0;pointer-events:none}
body.b-slam .b-onde{animation:onde 1.3s cubic-bezier(.1,.7,.3,1) both}
@keyframes onde{0%{opacity:.9;transform:scale(.4);border-width:6px}100%{opacity:0;transform:scale(9);border-width:1px}}
.b-bas{position:absolute;left:4vw;right:4vw;bottom:5.5vh;display:flex;align-items:flex-end;justify-content:space-between;gap:4vw;opacity:0;transition:opacity 2s ease 1s}
body.b-pose .b-bas,body.b-pose .b-haut{opacity:1}
.b-conseil{max-width:52vw;border-left:2px solid var(--or);padding:.4vh 0 .4vh 1.4vw}
.b-conseil em{display:block;font-style:normal;text-transform:uppercase;font-size:clamp(10px,.68vw,14px);font-weight:700;letter-spacing:.4em;color:var(--or);margin-bottom:1vh}
.b-conseil > span{display:block;font-size:clamp(15px,1.3vw,27px);font-weight:500;line-height:1.45;text-shadow:0 2px 14px rgba(0,0,0,.95)}
.b-anneau{position:relative;width:clamp(96px,8.5vw,170px);height:clamp(96px,8.5vw,170px);flex:none}
.b-anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
.b-anneau circle{fill:none;stroke-width:3}
.b-anneau .fond{display:none}
.b-anneau .arc{stroke:var(--or);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3}
.b-pct{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:clamp(22px,1.9vw,40px);font-variant-numeric:tabular-nums}
.b-pct sup{font-size:.45em;color:var(--or);vertical-align:.8em}
.b-haut{position:absolute;left:0;right:0;top:35vh;text-align:center;opacity:0;transition:opacity 2s ease 1.2s}
.b-infos{font-size:clamp(10px,.74vw,15px);letter-spacing:.42em;text-transform:uppercase;color:var(--creme)}
.b-infos b{color:var(--or);font-weight:700}
.b-statut{margin-top:1.4vh;font-size:clamp(10px,.68vw,14px);letter-spacing:.14em;color:var(--gris)}
.b-statut small{margin-left:.8em;opacity:.8}
.b-patience{margin-top:1.2vh;font-size:clamp(10px,.68vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--or2)}

/* ---------- C : Nuit de bataille ---------- */
body.v-c #diapo{filter:brightness(.5) saturate(.4) contrast(1.25)}
body.v-c .teinte{background:linear-gradient(180deg,rgba(12,28,70,.85),rgba(16,30,60,.6) 55%,rgba(25,18,12,.7))}
body.v-c .chaud,body.v-c .rayons{display:none}
body.v-c .brume{opacity:.3}
body.v-c #nuit{display:block}
.c-haut{position:absolute;top:6vh;left:0;right:0;text-align:center;font-size:clamp(10px,.74vw,15px);letter-spacing:.42em;text-transform:uppercase;color:var(--creme);opacity:0;transition:opacity 2s ease 3s}
.c-haut b{color:var(--or);font-weight:700}
body.c-go .c-haut{opacity:1}
.c-centre{position:absolute;left:50%;top:45%;width:min(46vw,880px);transform:translate(-50%,-50%);text-align:center}
.c-centre .logo-or{opacity:0}
body.c-go .c-centre .logo-or{animation:apparition 4s cubic-bezier(.2,.7,.2,1) both 1.2s}
.c-progres{width:72%;margin:6vh auto 0;opacity:0;transition:opacity 2s ease 3.5s}
body.c-go .c-progres{opacity:1}
.c-barre{position:relative;height:2px;background:rgba(239,230,214,.12)}
.c-barre i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(210,160,50,.2),var(--or2));box-shadow:0 0 10px rgba(240,207,122,.9)}
.c-barre i:after{content:"";position:absolute;right:-2px;top:-3px;width:4px;height:8px;background:#fff6d8;box-shadow:0 0 12px 3px rgba(255,220,140,.95)}
.c-ligne{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.4vh;font-size:clamp(10px,.7vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}
.c-ligne b{font-weight:300;font-size:2.1em;letter-spacing:.02em;color:var(--creme);font-variant-numeric:tabular-nums}
.c-ligne b sup{font-size:.45em;color:var(--or);vertical-align:.8em;margin-left:.1em}
.c-fichier{margin-top:.6vh;font-size:clamp(10px,.62vw,12px);letter-spacing:.06em;color:rgba(169,162,148,.7);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-conseil{position:absolute;left:0;right:0;bottom:12vh;text-align:center;padding:0 14vw;opacity:0;transition:opacity 2s ease 4s}
body.c-go .c-conseil{opacity:1}
.c-conseil > span{display:inline-block;font-weight:500;font-size:clamp(15px,1.2vw,25px);line-height:1.5;text-shadow:0 2px 14px rgba(0,0,0,.95)}
.c-patience{position:absolute;left:0;right:0;bottom:7.5vh;text-align:center;font-size:clamp(10px,.68vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--or2)}
.c-legende{position:absolute;right:3vw;bottom:4vh;font-size:clamp(10px,.7vw,14px);letter-spacing:.24em;text-transform:uppercase;color:var(--gris);text-shadow:0 1px 10px #000}
.c-legende:before{content:"";display:inline-block;width:2.2vw;height:1px;background:var(--or);vertical-align:middle;margin-right:.9vw}


/* ---------- Ouvertures de la bande-annonce ---------- */
.ouv{position:absolute;top:0;left:0;right:0;bottom:0;display:none;overflow:hidden}
body.ouv-actu-on .ouv-actu,body.ouv-carte-on .ouv-carte{display:block}
body.ouv-actu-on #scene,body.ouv-carte-on #scene{opacity:0}
/* Actualites 1944 : amorce de bobine, compte a rebours, carton titre */
.ouv-actu{background:#140f09}
.actu-cadre{position:absolute;top:0;left:0;right:0;bottom:0;filter:sepia(.85) contrast(1.15) brightness(.95);animation:papillote .12s steps(2) infinite}
@keyframes papillote{50%{opacity:.93}}
.actu-cercle{position:absolute;left:50%;top:50%;width:62vh;height:62vh;margin:-31vh 0 0 -31vh;border-radius:50%;border:.5vh solid #e9dcc0;box-shadow:0 0 0 2vh #2a2016,0 0 0 2.4vh #e9dcc0;background:#7d6a4c;overflow:hidden}
.actu-cercle i{position:absolute;background:#e9dcc0;opacity:.8}
.actu-cercle .h{left:-10%;right:-10%;top:50%;height:.35vh;margin-top:-.17vh}
.actu-cercle .v{top:-10%;bottom:-10%;left:50%;width:.35vh;margin-left:-.17vh}
.actu-balai{position:absolute;top:0;left:0;right:0;bottom:0;background:conic-gradient(rgba(20,14,8,.55) calc(var(--balai, 0) * 1turn), rgba(0,0,0,0) 0)}
.actu-num{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font:900 34vh/1 Montserrat,system-ui,sans-serif;color:#f3ead6;text-shadow:0 0 2vh rgba(0,0,0,.5)}
.actu-titre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:5vh 7vw;border:.4vh double #e9dcc0;outline:.25vh solid #e9dcc0;outline-offset:1.4vh;text-align:center;color:#f3ead6;opacity:0;transition:opacity .25s}
.actu-titre small{display:block;font:500 2.4vh Georgia,serif;font-style:italic;letter-spacing:.3em;margin-bottom:1vh}
.actu-titre b{display:block;font:900 8vh/1.05 Montserrat,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.actu-titre span{display:block;width:40%;height:.3vh;background:#e9dcc0;margin:2.4vh auto}
.actu-titre em{display:block;font:400 3vh Georgia,serif;letter-spacing:.24em;text-transform:uppercase}
body.actu-titre-on .actu-titre{opacity:1}
body.actu-titre-on .actu-cercle{display:none}
.actu-rayures{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:.55;
  background:linear-gradient(90deg,rgba(0,0,0,0) 18%,rgba(255,250,235,.35) 18.15%,rgba(0,0,0,0) 18.3%,rgba(0,0,0,0) 71%,rgba(0,0,0,.45) 71.1%,rgba(0,0,0,0) 71.25%);
  animation:rayures .9s steps(5) infinite}
@keyframes rayures{20%{background-position:3vw 0}40%{background-position:-6vw 0}60%{background-position:9vw 0}80%{background-position:-2vw 0}}
.actu-poussiere{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
/* Carte du front : carte d'etat-major qui se dessine, puis zoom sur Cavigny */
.ouv-carte{background:#14110d;overflow:hidden}
.carte-zoom{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
#carte-cv{position:absolute;top:0;left:0;width:100%;height:100%}
#carte-svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.carte-aerien{position:absolute;top:0;left:0;transform-origin:0 0;opacity:0;background-size:100% 100%}
.carte-trace{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.carte-trace.on{transition:stroke-dashoffset var(--d,2.4s) ease-in-out;stroke-dashoffset:0}
.carte-mot{opacity:0;transition:opacity .9s ease}
.carte-mot.on{opacity:1}
.carte-voile{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(10,8,5,.6) 100%)}
.carte-legende{position:absolute;left:4vw;bottom:6vh;font:400 2.6vh "Courier New",monospace;letter-spacing:.12em;color:#efe6d6;text-shadow:0 1px 6px #000}

/* ---------- Ébauche : barre de réglage (absente du site final) ---------- */
#ebauche{position:fixed;top:10px;right:10px;z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:min(96vw,1100px);
  background:rgba(10,10,12,.85);border:1px solid rgba(210,160,50,.4);border-radius:8px;padding:7px 9px;font:500 12px Montserrat,system-ui,sans-serif;transition:opacity .4s}
#ebauche.discret{opacity:.1}
#ebauche:hover{opacity:1}
#ebauche button,#ebauche select{font:inherit;color:var(--creme);background:#1d1c20;border:1px solid #3a3730;border-radius:5px;padding:5px 9px;cursor:pointer}
#ebauche button:hover,#ebauche select:hover{border-color:var(--or)}
#ebauche button.on{background:var(--or);color:#141419;border-color:var(--or);font-weight:700}
#ebauche label{color:var(--gris);display:flex;gap:5px;align-items:center;cursor:pointer}
#ebauche .sep{width:1px;height:20px;background:#3a3730}
#toast{position:fixed;left:3vw;top:10px;z-index:50;max-width:min(40vw,520px);background:rgba(10,10,12,.85);border-left:2px solid var(--or);padding:10px 14px;font-size:13px;line-height:1.45;color:var(--creme);opacity:0;transition:opacity .5s;pointer-events:none}
#toast b{display:block;color:var(--or);letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:3px}
#toast.on{opacity:1}
#demarrer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;overflow:auto;padding:24px 16px}
#demarrer .d-fond{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;filter:saturate(.6) brightness(.32);transform:scale(1.04)}
#demarrer .d-fond:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.85) 85%)}
#demarrer .d-contenu{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:760px;width:100%}
#demarrer .d-logo{width:min(380px,70vw)}
#demarrer h1{font-size:clamp(13px,1.3vw,17px);font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:var(--or);margin-top:6px;padding-left:.5em}
#demarrer .d-sous{font-size:15px;color:var(--creme);max-width:46ch;line-height:1.5}
#demarrer .d-vars{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;width:100%;margin:6px 0 4px;background:rgba(210,160,50,.3);border:1px solid rgba(210,160,50,.3)}
#demarrer .d-vars li{background:rgba(12,11,10,.88);padding:14px 12px;font-size:12.5px;line-height:1.45;color:var(--gris)}
#demarrer .d-vars b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--creme);margin-bottom:5px}
#demarrer .d-go{font:700 14px Montserrat,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#141419;background:var(--or);border:0;padding:14px 28px;cursor:pointer;box-shadow:0 0 30px rgba(210,160,50,.35)}
#demarrer .d-go:hover,#demarrer .d-go:focus-visible{background:var(--or2);outline:2px solid var(--or2);outline-offset:3px}
#demarrer i{font-style:normal;font-size:12px;color:#8a8478;letter-spacing:.04em;max-width:52ch;line-height:1.5}
@media (max-width:640px){#demarrer .d-vars{grid-template-columns:1fr}}
#credit{position:fixed;left:0;right:0;bottom:6px;text-align:center;z-index:11;font-size:10px;letter-spacing:.08em;color:rgba(239,230,214,.38)}
#son-bloque{position:fixed;left:50%;bottom:2.4vh;transform:translateX(-50%);z-index:40;display:none;font-size:12px;letter-spacing:.2em;color:var(--gris);text-transform:uppercase}
</style>

/* ---------- État du chargement ---------- */
var BORNES = [[0,6],[6,58],[58,78],[78,99]];
var TAU = [8, 70, 35, 140];          // secondes : vitesse d'approche quand GMod ne donne pas de chiffres
var E = { serveur:'La Bataille des Haies', carte:'', max:0, total:0, needed:0, phase:0, frac:-1,
          affiche:0, debut:Date.now(), debutPhase:Date.now(), statut:'Connexion au serveur', fichier:'' };
function poserPhase(p){ if (p <= E.phase) return; E.phase = p; E.frac = -1; E.debutPhase = Date.now(); }

var TRAD = [
  [/retrieving server info/i, 'Liaison avec le serveur'],
  [/(requesting|fetching|getting).*workshop|workshop info/i, 'Consultation de la collection Workshop'],
  [/mounting/i, 'Montage des addons'],
  [/workshop complete/i, 'Workshop terminé'],
  [/sending client info/i, 'Envoi des informations au serveur'],
  [/client info sent/i, 'Informations envoyées'],
  [/lua/i, 'Démarrage des scripts'],
  [/parsing game info/i, 'Lecture des données de jeu'],
  [/precach/i, 'Préchargement des modèles'],
  [/initiali[sz]/i, 'Initialisation'],
  [/loading/i, 'Chargement de la carte'],
  [/receiving|getting/i, 'Réception des données']
];
function traduire(s){
  var m = s.match(/download\w*\s*'?"?([^'"(]*)/i);
  if (m) return 'Téléchargement' + (m[1] && m[1].trim() ? ' : ' + m[1].trim() : '');
  for (var i = 0; i < TRAD.length; i++) if (TRAD[i][0].test(s)) return TRAD[i][1];
  return s.replace(/\.+$/, '');
}

window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume){
  if (servername) E.serveur = servername.replace(/^\s*\[[^\]]*\]\s*/, '').split('|')[0].trim() || servername;
  if (mapname) E.carte = String(mapname).replace(/^(rp|gm|dm|ttt|mg)_/i, '').replace(/_v?\d.*$/i, '').replace(/_/g, ' ')
    .replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); }) || mapname;
  if (maxplayers) E.max = maxplayers;
  var v = parseFloat(volume);
  if (!isNaN(v) && v >= 0) { volBase = Math.min(1, v); appliquerVolumes(); }
  passerGMod('GameDetails');
};
window.SetFilesTotal = function(t){ E.total = +t || 0; };
window.SetFilesNeeded = function(n){
  E.needed = +n || 0;
  if (E.total > 0 && E.needed < E.total) { poserPhase(2); E.frac = 1 - E.needed / E.total; }
};
window.DownloadingFile = function(f){
  f = String(f || '').replace(/\\/g, '/');
  var p = f.split('/'); E.fichier = p.slice(-2).join('/');
  poserPhase(2);
};
window.SetStatusChanged = function(s){
  s = String(s || ''); var b = s.toLowerCase();
  if (/workshop|mount|addon/.test(b)) poserPhase(/complete/.test(b) ? 2 : 1);
  else if (/download/.test(b) && E.phase < 1) poserPhase(1);
  if (/lua|client info|sending|precach|loading|initiali|parsing|spawn/.test(b) && !/workshop|download/.test(b)) { poserPhase(3); E.fichier = ''; }
  var m = s.match(/(\d+)\s*(?:\/|of|sur)\s*(\d+)/i);
  if (m && E.phase === 1 && +m[2] > 0) E.frac = Math.min(1, m[1] / m[2]);
  E.statut = traduire(s);
};

function mmss(ms){ var s = Math.floor(ms/1000); return (s/60|0) + ':' + ('0' + s%60).slice(-2); }

function tic(){
  var now = Date.now(), b = BORNES[E.phase], t;
  if (E.frac >= 0) t = b[0] + (b[1]-b[0]) * E.frac;
  else t = b[0] + (b[1]-b[0]) * 0.94 * (1 - Math.exp(-(now - E.debutPhase)/1000 / TAU[E.phase]));
  if (t > E.affiche) E.affiche += Math.max(0.02, (t - E.affiche) * 0.06);
  var pct = Math.min(99, E.affiche);
  poser('pct', String(Math.floor(pct)));
  tous('[data-v="barre"]').forEach(function(e){ e.style.width = pct + '%'; });
  tous('[data-v="anneau"]').forEach(function(e){ e.style.strokeDashoffset = (339.3 * (1 - pct/100)).toFixed(1); });
  poser('statut', E.statut);
  poser('fichier', E.fichier);
  poser('serveur', E.serveur);
  poser('carte', E.carte || '—');
  poser('joueurs', E.max ? E.max + ' places' : '');
  poser('duree', mmss(now - E.debut));
  if (now - E.debut > 40000) D.body.classList.add('lent');
}
poser('patience', C.patience || '');

/* ---------- Brume (texture générée, raccord sans couture) ---------- */
function texBrume(n, haut){
  var c = D.createElement('canvas'); c.width = 1024; c.height = 384; var g = c.getContext('2d');
  for (var i = 0; i < n; i++){
    var x = Math.random()*1024, y = haut + Math.random()*(384-haut), r = 70 + Math.random()*170, a = .04 + Math.random()*.07;
    [x - 1024, x, x + 1024].forEach(function(xx){
      var gr = g.createRadialGradient(xx, y, 0, xx, y, r);
      gr.addColorStop(0, 'rgba(214,214,204,' + a + ')'); gr.addColorStop(1, 'rgba(214,214,204,0)');
      g.fillStyle = gr; g.fillRect(xx - r, y - r, 2*r, 2*r);
    });
  }
  return 'url(' + c.toDataURL() + ')';
}
D.querySelector('.brume.b1').style.backgroundImage = texBrume(60, 140);
D.querySelector('.brume.b2').style.backgroundImage = texBrume(40, 90);

/* ---------- Braises et grain ---------- */
function spriteRadial(stops){
  var c = D.createElement('canvas'); c.width = c.height = 64; var g = c.getContext('2d'), r = g.createRadialGradient(32,32,0,32,32,32);
  stops.forEach(function(s){ r.addColorStop(s[0], s[1]); }); g.fillStyle = r; g.fillRect(0,0,64,64); return c;
}
var sprite = spriteRadial([[0,'rgba(255,236,190,1)'],[.25,'rgba(255,170,70,.85)'],[1,'rgba(255,120,30,0)']]);
var spriteBlanc = spriteRadial([[0,'rgba(255,255,255,1)'],[.18,'rgba(255,246,220,.95)'],[.45,'rgba(255,220,160,.35)'],[1,'rgba(255,200,120,0)']]);
var cv = D.getElementById('braises'), cx = cv.getContext('2d'), nv = D.getElementById('nuit'), nx = nv.getContext('2d'), parts = [], W = 0, H = 0;
// braises en demi-resolution (agrandies par le navigateur) : moins de pixels a redessiner ; un tiers en mode leger
var kBraises = 0.5;
function taille(){ var k = kBraises; W = cv.width = nv.width = innerWidth * k; H = cv.height = nv.height = innerHeight * k; }
function braise(neuve){ return { x: Math.random()*W, y: neuve ? H + 20 : Math.random()*H, v: .35 + Math.random()*1.1, d: (Math.random()-.5)*.5,
  s: 3 + Math.random()*9, a: .25 + Math.random()*.6, o: Math.random()*6.28, w: .006 + Math.random()*.02 }; }
taille(); addEventListener('resize', taille);
for (var k = 0; k < 70; k++) parts.push(braise(false));
var pulse = 0;
function dessiner(){
  cx.clearRect(0,0,W,H); cx.globalCompositeOperation = 'lighter';
  var acc = 1 + pulse * 2.2, kk = W / 1920;
  for (var i = 0; i < parts.length; i++){
    var p = parts[i]; p.o += p.w; p.y -= p.v * acc * kk; p.x += (p.d + Math.sin(p.o) * .6) * kk;
    if (p.y < -30) parts[i] = braise(true);
    var fl = .6 + .4 * Math.sin(p.o * 3), s = p.s * kk;
    cx.globalAlpha = p.a * fl * (p.y / H * .8 + .2); cx.drawImage(sprite, p.x - s, p.y - s, s*2, s*2);
  }
  cx.globalAlpha = 1;
}
var grains = [];
for (var g = 0; g < 4; g++){
  var c = D.createElement('canvas'); c.width = c.height = 256; var x = c.getContext('2d'), id = x.createImageData(256,256);
  for (var j = 0; j < id.data.length; j += 4){ var n = Math.random()*255|0; id.data[j]=id.data[j+1]=id.data[j+2]=n; id.data[j+3]=255; }
  x.putImageData(id,0,0); grains.push('url(' + c.toDataURL() + ')');
}
var elGrain = D.getElementById('grain'), iGrain = 0;
// le grain est masque dans la bande-annonce : inutile de le faire tourner (recalcul de style 14 fois par seconde)
if (C.variante !== 'b') setInterval(function(){ elGrain.style.backgroundImage = grains[iGrain = (iGrain+1) % grains.length]; }, 70);

/* ---------- Nuit de bataille : traçantes, fusées éclairantes, explosions ---------- */
var traceurs = [], fusees = [], booms = [], prochain = { r: 0, f: 0, b: 0 }, nuitSale = false;
function hasard(a, b){ return a + Math.random()*(b - a); }
// Plus de tracantes (jugees « pas tres belles ») : des lueurs de tir qui clignotent au loin, par rafales
function rafale(now){
  var x = W * hasard(.04, .96), y = H * hasard(.56, .7), n = 3 + (Math.random()*6|0), cad = hasard(70, 140), t = hasard(.5, 1.1);
  for (var i = 0; i < n; i++) traceurs.push({ t0: now + i*cad, x: x + (Math.random()-.5)*W*.012, y: y + (Math.random()-.5)*H*.006, d: hasard(45, 90), t: t });
}
function fusee(now){ if (fusees.length < 2) fusees.push({ t0: now, x: W*hasard(.15, .85), y: H*hasard(.06, .2), vie: hasard(9000, 13000), ph: Math.random()*9 }); }
function boom(now){
  var fort = Math.random() < .22;
  booms.push({ t0: now, x: W*hasard(.05, .95), y: H*hasard(.56, .72), r: W*(fort ? hasard(.2, .3) : hasard(.08, .16)), vie: fort ? 1800 : 1200, fort: fort });
  if (fort) { var sc = D.getElementById('scene'); relancer(sc, 'tremble'); }
}
function nuit(now){
  if (!D.body.classList.contains('v-c')) { if (nuitSale) { nx.clearRect(0,0,W,H); nuitSale = false; traceurs = []; fusees = []; booms = []; } return; }
  nuitSale = true;
  if (!prochain.r) { prochain = { r: now + 1800, f: now + 2600, b: now + 3200 }; }
  if (now > prochain.r) { rafale(now); if (Math.random() < .3) rafale(now + 300); prochain.r = now + hasard(500, 2600); }
  if (now > prochain.f) { fusee(now); prochain.f = now + hasard(6000, 11000); }
  if (now > prochain.b) { boom(now); prochain.b = now + hasard(1800, 5500); }
  nx.clearRect(0,0,W,H); nx.globalCompositeOperation = 'lighter';
  // fusées éclairantes : elles éclairent la scène en descendant lentement
  fusees = fusees.filter(function(f){
    var t = now - f.t0; if (t > f.vie) return false;
    var I = Math.min(1, t/500) * Math.min(1, (f.vie - t)/2500) * (.86 + .14*Math.sin(t*.031 + f.ph) * Math.sin(t*.013));
    var x = f.x + Math.sin(t/900 + f.ph) * W*.006, y = f.y + t/1000 * H*.014;
    var gr = nx.createRadialGradient(x, y, 0, x, y, W*.6);
    gr.addColorStop(0, 'rgba(255,240,215,' + (.26*I) + ')'); gr.addColorStop(.3, 'rgba(255,226,180,' + (.1*I) + ')'); gr.addColorStop(1, 'rgba(255,210,150,0)');
    nx.fillStyle = gr; nx.fillRect(0,0,W,H);
    var s = W*.035*I; nx.globalAlpha = .55*I; nx.drawImage(spriteBlanc, x - s*2.5, y - s*2.5, s*5, s*5);
    nx.globalAlpha = I; nx.drawImage(spriteBlanc, x - s*.5, y - s*.5, s, s); nx.globalAlpha = 1;
    return true;
  });
  // explosions à l'horizon
  booms = booms.filter(function(b){
    var k = (now - b.t0) / b.vie; if (k >= 1) return false; if (k < 0) return true;
    var a = Math.pow(1 - k, 2), r = b.r * (.55 + k*.7);
    var gr = nx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    gr.addColorStop(0, 'rgba(255,200,120,' + (.75*a) + ')'); gr.addColorStop(.35, 'rgba(255,120,40,' + (.32*a) + ')'); gr.addColorStop(1, 'rgba(255,80,20,0)');
    nx.fillStyle = gr; nx.fillRect(b.x - r, b.y - r, 2*r, 2*r);
    if (b.fort) { nx.fillStyle = 'rgba(255,150,80,' + (.1*a) + ')'; nx.fillRect(0,0,W,H); }
    return true;
  });
  // lueurs de tir au loin
  traceurs = traceurs.filter(function(e){
    var dt = now - e.t0; if (dt < 0) return true; if (dt > e.d) return false;
    var I = 1 - dt / e.d, r = W * .01 * e.t;
    nx.globalAlpha = .35 * I; nx.drawImage(sprite, e.x - 3*r, e.y - 3*r, 6*r, 6*r);
    nx.globalAlpha = .9 * I; nx.drawImage(spriteBlanc, e.x - r, e.y - r, 2*r, 2*r);
    nx.globalAlpha = 1;
    return true;
  });
}

/* ---------- Son ---------- */
var volBase = 0.7, musique = new Audio(), ambiance = new Audio(), impact = new Audio(), analyse = null, iMus = C.musique || 0;
musique.preload = 'auto'; ambiance.loop = true;
if (C.ambiance) ambiance.src = C.ambiance;
if (C.impact) impact.src = C.impact;
var MIX = { musique: .55, ambiance: .26, impact: .8 };
var fondus = {}, ambMul = 1;   // ambMul : les bruits du front montent a 1,6 apres la musique
// volume du joueur (curseur, memorise) x volume du jeu (GameDetails)
var volUser = 1, volAvantMuet = 1;
try { var vm = localStorage.getItem('lbdh_volume'); if (vm !== null && !isNaN(+vm)) volUser = Math.max(0, Math.min(1, +vm)); } catch (e) {}
function gain(){ return volBase * volUser; }
function appliquerVolumes(){
  if (!fondus.m) musique.volume = MIX.musique * gain();
  if (!fondus.a) ambiance.volume = C.avecAmbiance ? MIX.ambiance * gain() * ambMul : 0;
  if (!musique2.paused) musique2.volume = MIX.musique * gain();
}
(function(){
  var boite = D.getElementById('volume'), curseur = D.getElementById('vol-curseur'), pct = D.getElementById('vol-pct');
  function montrer(){ curseur.value = Math.round(volUser * 100); pct.textContent = Math.round(volUser * 100) + ' %'; boite.classList.toggle('muet', volUser === 0); }
  function regler(v, garder){
    volUser = Math.max(0, Math.min(1, v)); montrer();
    // un reglage du curseur coupe les fondus en cours : le volume suit la main du joueur
    clearInterval(fondus.m); fondus.m = 0; clearInterval(fondus.a); fondus.a = 0;
    appliquerVolumes();
    if (garder) try { localStorage.setItem('lbdh_volume', String(volUser)); } catch (e) {}
  }
  curseur.addEventListener('input', function(){ regler(+curseur.value / 100, false); });
  curseur.addEventListener('change', function(){ regler(+curseur.value / 100, true); });
  D.getElementById('vol-muet').addEventListener('click', function(e){
    e.stopPropagation();
    if (volUser > 0) { volAvantMuet = volUser; regler(0, true); } else regler(volAvantMuet || .7, true);
  });
  boite.addEventListener('click', function(e){ e.stopPropagation(); });   // ne declenche pas « clique pour activer la musique »
  montrer();
})();
function fondu(a, cle, cible, ms){
  clearInterval(fondus[cle]); var de = a.volume, t0 = Date.now();
  fondus[cle] = setInterval(function(){ var k = Math.min(1, (Date.now()-t0)/ms); a.volume = de + (cible-de)*k; if (k >= 1){ clearInterval(fondus[cle]); fondus[cle] = 0; } }, 50);
}
function choisirMusique(i){
  var L = C.musiques || []; if (!L.length) return;
  iMus = (i + L.length) % L.length; musique.src = L[iMus].src; musique.loop = L.length === 1 && C.variante !== 'b';
  D.getElementById('credit').textContent = L[iMus].credit ? '♪ ' + L[iMus].credit : '';
}
musique.addEventListener('ended', function(){
  // bande-annonce : le generique ne se rejoue pas ; les bruits du front prennent le relais
  // bande-annonce : le generique ne se rejoue pas ; la seconde musique et ses plans prennent le relais
  if (C.variante === 'b') {
    finMusique = Date.now();
    if (C.musique2 && PL2.length) { partie2 = true; iPl = -1; musique2.volume = MIX.musique * gain(); var q = musique2.play(); if (q && q.catch) q.catch(function(){}); }
    else bruitsDuFront();
    return;
  }
  choisirMusique(iMus + 1); musique.play();
});
function lancerSon(){
  if (!musique.src) choisirMusique(iMus);
  musique.volume = 0;
  var p = musique.play();
  var ok = function(){ fondu(musique, 'm', MIX.musique * gain(), 4000); brancherAnalyse(); D.getElementById('son-bloque').style.display = 'none'; };
  if (p && p.then) p.then(ok).catch(function(){ D.getElementById('son-bloque').style.display = 'block'; });
  else ok();
  if (C.ambiance){ ambiance.volume = 0; var q = ambiance.play(); if (q && q.catch) q.catch(function(){});
    fondu(ambiance, 'a', C.avecAmbiance ? MIX.ambiance * gain() : 0, 6000); }
}
D.addEventListener('click', function(){ if (musique.paused && D.body.classList.contains('parti')) lancerSon(); });
function brancherAnalyse(){
  if (analyse || C.sansAnalyse) return;
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    var ctx = new AC();
    if (ctx.state !== 'running') { ctx.close(); return; }   // sinon la musique deviendrait muette
    var src = ctx.createMediaElementSource(musique), an = ctx.createAnalyser();
    an.fftSize = 256; an.smoothingTimeConstant = .7; src.connect(an); an.connect(ctx.destination);
    analyse = { an: an, buf: new Uint8Array(an.frequencyBinCount) };
  } catch (e) {}
}
function lirePulse(){
  if (!analyse) { pulse *= .95; return; }
  analyse.an.getByteFrequencyData(analyse.buf);
  var s = 0; for (var i = 1; i < 7; i++) s += analyse.buf[i];
  var v = Math.max(0, (s / 6 / 255 - .45) / .55);
  pulse += (v - pulse) * (v > pulse ? .35 : .08);
}


/* ---------- Ouvertures de la bande-annonce (avant que le logo s'ecrase) ---------- */
// Carte d'etat-major dessinee (tournage/carte.py, positions reelles) : le front et l'attaque du 7 juillet se tracent au
// crayon gras, zoom sur Cavigny, puis plongee dans la vue aerienne de la map jusqu'a l'explosion du logo.
var CA = C.carte || null, carteFaite = false, carteSeq = null, CI = {};
function cheminVB(pts){ return pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' '); }
function construireCarte(){
  if (carteFaite || !CA) return; carteFaite = true;
  // images de la carte, de la vue aerienne et du masque rond : decodees d'avance, dessinees dans le canevas
  CI.carte = new Image(); CI.carte.src = CA.img;
  CI.aerien = new Image(); CI.aerien.src = CA.aerien;
  if (CA.masque) { CI.masque = new Image(); CI.masque.src = CA.masque; }
  // converties en images decodees une fois pour toutes (ImageBitmap) : sinon Chrome redecode la carte de 4800 px
  // pendant l'animation (110 ms d'arret a chaque fois)
  ['carte', 'aerien', 'masque'].forEach(function(cle){
    var im = CI[cle]; if (!im) return;
    var ok = function(){ if (window.createImageBitmap) createImageBitmap(im).then(function(b){ CI[cle + 'B'] = b; }).catch(function(){}); };
    if (im.complete && im.naturalWidth) ok(); else im.addEventListener('load', ok);
  });
  var ae0 = D.querySelector('.carte-aerien'); ae0.style.display = 'none';
  // decoupe ronde au bord irregulier (forme du bourg sur la carte), pas un carre
  if (CA.masque) { ae0.style.webkitMaskImage = 'url("' + CA.masque + '")'; ae0.style.maskImage = 'url("' + CA.masque + '")';

    for (var j2 = PL2.length - 1; j2 >= 0; j2--) if (t2 >= PL2[j2].debut) { k2 = j2; break; }

    recaler(Math.max(0, (t2 - PL2[k2].debut) * 1000));
    return;
  }
  var k = 0;
  for (var j = PL.length - 1; j >= 0; j--) if (voulu >= PL[j].debut) { k = j; break; }

  }
